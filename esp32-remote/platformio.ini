; ESP32 Wi-Fi remote for the MM32SPIN27 hoverboard firmware (RemoteUartBus protocol).
; Build and flash: PlatformIO in VS Code (env "esp32dev"), or `pio run -t upload`.

[env:esp32dev]
platform = espressif32 @ ^6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    links2004/WebSockets @ ^2.4.1
